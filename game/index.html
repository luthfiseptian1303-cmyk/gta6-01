<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Heat — Open-World Crime Game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c1018; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* Test hooks, never shown: headless playtests read these back. */
  #testout, #err { position: absolute; left: -9999px; top: 0; width: 1px; height: 1px; overflow: hidden; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar Heat: an open-world crime game. Steal cars, outrun the police, and finish five missions across Solmar Bay"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<pre id="testout"></pre>
<pre id="err"></pre>
<script type="module" src="./src/main.js"></script>
</body>
</html>
